<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>As Águas do Cólera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body id="body">
<div class="stage">
  <main class="book" id="book" role="main" aria-live="polite"></main>
  <aside class="log" id="log">
    <button type="button" class="log-tab" id="logTab" aria-expanded="false" aria-controls="logPanel">
      <span class="log-tab-label">Diário de bordo</span>
    </button>
    <div class="log-panel" id="logPanel">
      <div class="log-title">Diário de bordo</div>
      <ul id="logList"></ul>
    </div>
  </aside>
</div>

<script src="js/story.js"></script>
<script src="js/app.js"></script>
</body>
</html>
