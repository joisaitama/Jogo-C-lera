    <rect x="80" y="190" width="60" height="130"/>
    <rect x="150" y="230" width="110" height="90"/>
    <polygon points="260,230 300,150 340,230"/>
    <rect x="292" y="150" width="16" height="80"/>
    <rect x="360" y="200" width="70" height="120"/>
    <rect x="440" y="240" width="130" height="80"/>
    <rect x="580" y="210" width="60" height="110"/>
    <rect x="650" y="235" width="100" height="85"/>
    <!-- torre com cruz -->
